{% extends "_base.html" %}
{% load static %}
{% block title %}
    Home
{% endblock title %}
{% block content %}
    <h1>Homepage</h1>
    <img class="bookcover"
         src="{% static 'images/dfp.jpg' %}"
         alt="Book cover"
         width="200"
         height="300">
    {% if user.is_authenticated %}
        <p>Hi {{ user.email }}!</p>
        <a class="nav-link" href="{% url 'account_logout' %}">Log Out</a>
    {% else %}
        <p>You are not logged in</p>
        <a href="{% url 'account_login' %}">Log In</a>
        <a href="{% url 'account_signup' %}">Sign Up</a>
    {% endif %}
{% endblock content %}
