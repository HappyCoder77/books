{% extends "_base.html" %}
{% load static %}
{% block title %}
    Home
{% endblock title %}
{% block content %}
    <h1>Homepage</h1>
    <img class="bookcover"
         src="{% static 'images/dfp.jpg' %}"
         alt="Book cover"
         width="200"
         height="300">
    {% if user.is_authenticated %}
        <p>Hi {{ user.email }}!</p>
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Log out</button>
        </form>
    {% else %}
        <p>You are not logged in</p>
        <a href="{% url 'login' %}">Log In</a>
        <a href="{% url 'signup' %}">Sign Up</a>
    {% endif %}
{% endblock content %}
